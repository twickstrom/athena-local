name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  secret-pattern-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan common secret patterns
        env:
          SECRET_PATTERN: AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|aws_access_key_id|aws_secret_access_key|github_pat_|ghp_
        run: |
          ! grep -RInE "$SECRET_PATTERN" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude=.github/workflows/security.yml
