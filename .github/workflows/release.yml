name: Release

# Manual dispatch runs a dry run. Pushing a v<version> tag publishes to npm via
# Trusted Publishing (OIDC — no long-lived token), attaches an SBOM and a
# build-provenance attestation, and cuts a GitHub release.
on:
  workflow_dispatch:
  push:
    tags:
      # changeset tag emits athena-local@<version>; v<version> stays supported
      # for a manual release.
      - "v*"
      - "athena-local@*"

permissions:
  contents: read

jobs:
  dry-run:
    name: Release dry run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Required checks
        run: bun run test:release

      - name: Pack dry run
        run: bun pm pack --dry-run

  publish:
    name: Publish to npm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # cut the GitHub release
      id-token: write # OIDC for npm Trusted Publishing + provenance
      attestations: write # build-provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node (npm publish via OIDC)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports Trusted Publishing
        # Trusted Publishing (OIDC) landed in npm 11.5; setup-node ships an older
        # line, so pull the current CLI before publishing.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the tag matches package.json
        run: |
          # Accept athena-local@<version> (from changeset tag) and v<version>.
          TAG="${GITHUB_REF_NAME##*@}"
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify a clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Working tree is not clean"
            exit 1
          fi

      - name: Required checks
        run: bun run test:release

      - name: Pack the release tarball
        run: npm pack

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: athena-local-sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: "*.tgz"

      - name: Publish to npm
        # No NODE_AUTH_TOKEN: auth is via OIDC once the package's trusted
        # publisher is registered on npmjs. provenance:true lives in
        # package.json publishConfig.
        run: npm publish --access public

      - name: Generate checksums
        run: sha256sum *.tgz athena-local-sbom.cdx.json > checksums.txt

      - name: Cut the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            *.tgz
            athena-local-sbom.cdx.json
            checksums.txt
