name: CLA

# Records each contributor's agreement to the Contributor License Agreement
# before their pull request can merge. Signatures are stored in this repo at
# signatures/cla.json.
#
# Requires a repository secret CLA_SIGNATURES_TOKEN: a fine-grained PAT with
# Contents read/write on this repo, used to commit the signature file. The
# built-in GITHUB_TOKEN drives the PR comment + status.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  cla:
    name: CLA assistant
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    if: >
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA and I hereby sign the CLA'
    steps:
      - name: CLA assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/twickstrom/athena-local/blob/main/CLA.md
          branch: main
          custom-pr-sign-comment: "I have read the CLA and I hereby sign the CLA"
          custom-notsigned-prcomment: "Thanks for the pull request. Before it can be merged, please read our [Contributor License Agreement](https://github.com/twickstrom/athena-local/blob/main/CLA.md) and sign it by posting the comment below."
          allowlist: twickstrom,dependabot[bot],renovate[bot]
