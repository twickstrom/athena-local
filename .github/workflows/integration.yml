name: Integration

# Boots the full Athena Local stack (PostgreSQL + MinIO + Hive Metastore +
# Trino) on Docker and runs a real AWS SDK AthenaClient query end to end. This
# is the primary full-stack suite; ubuntu-latest runners ship a working Docker
# daemon. It is heavier than the unit/protocol checks in ci.yml, so it runs on
# pushes to main and on PRs labeled "integration".

on:
  push:
    branches:
      - main
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  full-stack:
    name: Docker full-stack end-to-end
    # Only run on main, or on PRs that carry the "integration" label.
    if: >
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATHENA_LOCAL_CONTAINER_RUNTIME: docker
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local-secret
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start the local stack
        run: |
          nohup bun run src/cli.ts start --runtime docker > /tmp/athena-start.log 2>&1 &
          echo "Waiting for the Athena facade to come up..."
          up=
          for i in $(seq 1 120); do
            # A non-000 HTTP code means the facade is routing (even a 400).
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:4567/ \
                -H "X-Amz-Target: AmazonAthena.GetQueryExecution" \
                -H "Content-Type: application/x-amz-json-1.1" -d '{}' || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then echo "facade up (HTTP $code)"; up=1; break; fi
            sleep 2
          done
          if [ -z "$up" ]; then
            echo "::error::Athena facade never came up — stack boot failed"
            echo "--- start log ---"; cat /tmp/athena-start.log || true
            exit 1
          fi

      - name: Show stack status
        run: |
          docker ps --format '{{.Names}}\t{{.Status}}'
          echo "--- start log ---"; cat /tmp/athena-start.log || true

      - name: Seed the catalog
        run: bun run src/cli.ts seed --runtime docker

      - name: Run live end-to-end query
        env:
          ATHENA_LOCAL_LIVE: "1"
        run: bun test test/e2e/live-stack.test.ts

      - name: Tear down the stack
        if: always()
        run: bun run src/cli.ts destroy --runtime docker || true

      - name: Upload stack logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/stack-logs
          for c in athena-local-postgres athena-local-minio athena-local-hive-metastore athena-local-trino; do
            docker logs "$c" > "/tmp/stack-logs/$c.log" 2>&1 || true
          done
          echo "Collected logs:"; ls -la /tmp/stack-logs

  external-attach:
    name: Docker external-store attach
    # Pins that attach mode + s3:// / s3a:// external tables keep working live.
    if: >
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATHENA_LOCAL_CONTAINER_RUNTIME: docker
      ATHENA_LOCAL_STORAGE_BACKEND: external
      ATHENA_LOCAL_S3_BUCKET: analytics
      ATHENA_LOCAL_S3_ENDPOINT: http://localhost:19000
      ATHENA_LOCAL_S3_ACCESS_KEY: minioadmin
      ATHENA_LOCAL_S3_SECRET_KEY: minioadmin
      ATHENA_OUTPUT_LOCATION: s3://analytics/_results/
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start a standalone external MinIO (the "store you already run")
        run: |
          docker run -d --name ext-minio -p 19000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:19000/minio/health/ready && echo "minio up" && break
            sleep 1
          done

      - name: Start athena-local in external mode (attach to the MinIO)
        run: |
          nohup bun run src/cli.ts start --runtime docker > /tmp/athena-start.log 2>&1 &
          up=
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:4567/ \
              -H "X-Amz-Target: AmazonAthena.GetQueryExecution" \
              -H "Content-Type: application/x-amz-json-1.1" -d '{}' || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then echo "facade up (HTTP $code)"; up=1; break; fi
            sleep 2
          done
          docker ps --format '{{.Names}}\t{{.Status}}'
          if [ -z "$up" ]; then
            echo "::error::Athena facade never came up — stack boot failed"
            echo "--- start log ---"; cat /tmp/athena-start.log || true
            exit 1
          fi

      - name: Register s3:// and s3a:// external tables and query them
        env:
          ATHENA_LOCAL_LIVE_EXTERNAL: "1"
        run: bun test test/e2e/external-stack.test.ts

      - name: Tear down
        if: always()
        run: |
          bun run src/cli.ts destroy --runtime docker || true
          docker rm -f ext-minio || true

      - name: Upload stack logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/stack-logs
          for c in athena-local-postgres athena-local-hive-metastore athena-local-trino ext-minio; do
            docker logs "$c" > "/tmp/stack-logs/$c.log" 2>&1 || true
          done
          cat /tmp/athena-start.log || true
