name: Changesets

# Maintains the release. On every push to main, Changesets either opens/updates
# a "Version Packages" PR (consuming .changeset/*.md into a version bump +
# CHANGELOG) or, once that PR is merged, tags the new version. The tag is pushed
# with RELEASE_TOKEN (a PAT) so it triggers the Release workflow's OIDC publish —
# the built-in GITHUB_TOKEN cannot trigger another workflow.
#
# Requires a repository secret RELEASE_TOKEN: a fine-grained PAT with Contents
# read/write and Pull requests read/write on this repo.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Skip cleanly (green) until RELEASE_TOKEN is configured, instead of
      # failing every push. Secrets are not available in job-level `if`, so gate
      # the steps on a guard output.
      - name: Check for RELEASE_TOKEN
        id: guard
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "RELEASE_TOKEN is not set — skipping Changesets (no-op until configured)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Bun
        if: steps.guard.outputs.ready == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Create or update the Version PR
        if: steps.guard.outputs.ready == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: bun run changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # When the Version PR has merged, package.json carries a new version with no
      # matching tag — tag it and push (with the PAT) to trigger release.yml's
      # OIDC publish. The changesets action's own publish step only pushes tags
      # for an npm publish, not a bare `changeset tag`, so we do it explicitly.
      - name: Tag and push when the version is new
        if: steps.guard.outputs.ready == 'true'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ -n "$(git ls-remote --tags origin "$VERSION")" ]; then
            echo "$VERSION already on origin — nothing to release."
          else
            echo "Tagging $VERSION to trigger the Release workflow."
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
